root = ../../

filter = .*src/app.*
filter = .*tests/unit/os/freertos/freertos-plus/freertos-plus-tcp/source/portable/NetworkInterface/tms570lc435/test_NetworkInterface\.c

html = ../../build/app_unit_test_gcc/coverage/index.html
html-details = yes
html-title = foxBMS 2 app Test Coverage Report
html-medium-threshold = 75
html-high-threshold = 90
html-absolute-paths = no
html-encoding = UTF-8

txt = ../../build/app_unit_test_gcc/coverage/GcovCoverageResults.txt
cobertura = ../../build/app_unit_test_gcc/coverage/GcovCoverageCobertura.xml

sort = uncovered-percent
print-summary = yes
gcov-parallel = 8

merge-mode-functions = merge-use-line-min

fail-under-line = 66.25
fail-under-branch = 58.75
fail-under-function = 82.55
